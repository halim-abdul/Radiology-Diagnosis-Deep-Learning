<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="570" viewBox="0 0 1050 570"><rect width="1050" height="570" fill="#f7fafc"/><style>text{font:18px Arial;fill:#142b40}.heading{font:bold 27px Arial;fill:#10293e}.small{font:15px Arial;fill:#3b5870}.card{fill:white;stroke:#91abbc;stroke-width:2;rx:14}.arrow{stroke:#21759a;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#21759a"/></marker></defs><text class="heading" x="28" y="42">Radiology AI — research workflow</text><text class="small" x="28" y="69">Illustrative only • untrained models • no clinical use</text><rect class="card" x="30" y="103" width="255" height="88"/><text x="53" y="139">1. Image input</text><text class="small" x="53" y="165">X-ray / CT / MRI</text><rect class="card" x="398" y="103" width="255" height="88"/><text x="419" y="139">2. Prepare &amp; verify</text><text class="small" x="419" y="165">Privacy, pixels, geometry</text><rect class="card" x="768" y="103" width="255" height="88"/><text x="787" y="139">3. Analyze</text><text class="small" x="787" y="165">CNN · ViT · U-Net</text><path class="arrow" d="M285 147 H390"/><path class="arrow" d="M653 147 H760"/><rect class="card" x="768" y="269" width="255" height="88"/><text x="787" y="305">4. Check evidence</text><text class="small" x="787" y="333">Geometry &amp; attribution</text><path class="arrow" d="M894 191 V261"/><rect class="card" x="398" y="269" width="255" height="88"/><text x="417" y="305">5. Evaluate</text><text class="small" x="417" y="333">Patient-disjoint testing</text><path class="arrow" d="M768 313 H661"/><rect class="card" x="30" y="269" width="255" height="88"/><text x="48" y="305">6. Draft findings</text><text class="small" x="48" y="333">Unverified, evidence-linked</text><path class="arrow" d="M398 313 H293"/><rect x="30" y="432" width="993" height="100" rx="15" fill="#e0f2f1" stroke="#218b80" stroke-width="2"/><text class="heading" x="59" y="468">7. Clinician reviews and decides</text><text x="59" y="502">Model outputs and text drafts must never replace an expert interpretation.</text><path class="arrow" d="M156 357 V422"/></svg>