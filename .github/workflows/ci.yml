name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[test]'
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check src tests --select E4,E7,E9,F
